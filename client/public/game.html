<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Racer - J2ME Edition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }

  #game {
    image-rendering: -moz-crisp-edges;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 480px;
    height: 640px;
    background: #000;
    border: 4px solid #333;
    box-shadow: 0 0 0 4px #111, 0 0 40px rgba(0,0,0,0.8);
  }

  @media (max-width: 520px) {
    #game {
      width: 92vw;
      height: calc(92vw * 640 / 480);
    }
  }
</style>
</head>

<body>

<canvas id="game" width="240" height="320"></canvas>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------------
  // Retro Racer - J2ME Edition
  // Pure Canvas + vanilla JS, single file, no external assets.
  // ---------------------------------------------------------------------------

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  ctx.imageSmoothingEnabled = false;

  const W = 240;
  const H = 320;

  // ---------------------------------------------------------------------------
  // COLORS
  // ---------------------------------------------------------------------------

  const C = {
    sky: "#0a3a0a",
    grass1: "#006600",
    grass2: "#007700",
    road: "#4d4d4d",
    roadEdgeL: "#ffcc00",
    roadEdgeR: "#ffcc00",
    dash: "#ffffff",

    carRed: "#cc0000",
    carRedDark: "#770000",
    carRedGlass: "#66bbdd",

    carBlue: "#0000cc",
    carBlueDark: "#000077",
    carBlueGlass: "#aaddff",

    carYellow: "#eecc00",
    carYellowDark: "#aa8800",
    carYellowGlass: "#ffffff",

    black: "#000000",
    white: "#ffffff",

    hudBg: "#000000",
    hudText: "#ffaa00",

    green: "#00ff00",
    red: "#ff3333",

    wheel: "#111111"
  };

  // ---------------------------------------------------------------------------
  // ROAD GEOMETRY
  // ---------------------------------------------------------------------------

  const GRASS_W = 32;
  const ROAD_X = GRASS_W;
  const ROAD_W = W - GRASS_W * 2;

  const LANE_COUNT = 3;
  const LANE_W = ROAD_W / LANE_COUNT;

  const HUD_H = 26;

  function laneCenter(lane) {
    return ROAD_X + lane * LANE_W + LANE_W / 2;
  }

  // ---------------------------------------------------------------------------
  // GAME STATE
  // ---------------------------------------------------------------------------

  const STATE = {
    TITLE: 0,
    PLAY: 1,
    OVER: 2
  };

  let state = STATE.TITLE;

  let score = 0;

  let speed = 0;

  const SPEED_MIN = 1.8;
  const SPEED_MAX = 4.6;

  let dashOffset = 0;
  let grassOffset = 0;
  let frame = 0;

  // ---------------------------------------------------------------------------
  // PLAYER
  // ---------------------------------------------------------------------------

  const player = {
    lane: 1,

    // Actual pixel position.
    // This smoothly moves toward the selected lane.
    x: 0,

    y: H - 72,

    w: 26,
    h: 42,

    steerL: false,
    steerR: false,

    accel: false,
    brake: false
  };

  // ---------------------------------------------------------------------------
  // ENEMIES
  // ---------------------------------------------------------------------------

  let enemies = [];

  let spawnTimer = 0;

  let spawnInterval = 52;

  const DODGE_SCORE = 10;

  // ---------------------------------------------------------------------------
  // INPUT
  // ---------------------------------------------------------------------------

  const keys = Object.create(null);

  /*
   * IMPORTANT FIX:
   *
   * Previously ArrowLeft / ArrowRight were stored as:
   *
   *     keys.left = true
   *     keys.right = true
   *
   * and the update loop continuously moved the car while those values
   * were true.
   *
   * That caused the player to hold the key for a long time.
   *
   * Now:
   *
   *     ONE LEFT PRESS  = ONE LANE LEFT
   *     ONE RIGHT PRESS = ONE LANE RIGHT
   *
   * Browser key-repeat is also ignored using e.repeat.
   */

  window.addEventListener("keydown", function (e) {

    if (
      [
        "ArrowLeft",
        "ArrowRight",
        "ArrowUp",
        "ArrowDown",
        " ",
        "Enter"
      ].indexOf(e.key) >= 0
    ) {
      e.preventDefault();
    }

    // ---------------------------------------------------------
    // ONE PRESS = ONE LANE CHANGE
    // ---------------------------------------------------------

    if (!e.repeat && state === STATE.PLAY) {

      if (e.key === "ArrowLeft") {

        // Move one lane to the left.
        player.lane = Math.max(
          0,
          player.lane - 1
        );

        player.steerL = true;
        player.steerR = false;

      } else if (e.key === "ArrowRight") {

        // Move one lane to the right.
        player.lane = Math.min(
          LANE_COUNT - 1,
          player.lane + 1
        );

        player.steerR = true;
        player.steerL = false;
      }
    }

    // Speed controls remain continuous.
    if (e.key === "ArrowUp") {
      keys.up = true;
    }

    if (e.key === "ArrowDown") {
      keys.down = true;
    }

    // Start / restart.
    if (e.key === " " || e.key === "Enter") {
      pressAction();
    }
  });

  window.addEventListener("keyup", function (e) {

    if (e.key === "ArrowUp") {
      keys.up = false;
    }

    if (e.key === "ArrowDown") {
      keys.down = false;
    }
  });

  // ---------------------------------------------------------------------------
  // ACTION
  // ---------------------------------------------------------------------------

  function pressAction() {

    if (state === STATE.TITLE) {

      startGame();

    } else if (state === STATE.OVER) {

      state = STATE.TITLE;
      score = 0;
    }
  }

  // ---------------------------------------------------------------------------
  // TOUCH / POINTER CONTROL
  // ---------------------------------------------------------------------------

  /*
   * Touch control also uses ONE TAP = ONE LANE CHANGE.
   *
   * Left half  -> one lane left
   * Right half -> one lane right
   */

  canvas.addEventListener("pointerdown", function (e) {

    e.preventDefault();

    const rect = canvas.getBoundingClientRect();

    const x =
      (e.clientX - rect.left) /
      rect.width;

    // Start / restart.
    if (
      state === STATE.TITLE ||
      state === STATE.OVER
    ) {
      pressAction();
      return;
    }

    // ---------------------------------------------------------
    // LEFT SIDE
    // ---------------------------------------------------------

    if (x < 0.5) {

      player.lane = Math.max(
        0,
        player.lane - 1
      );

      player.steerL = true;
      player.steerR = false;

    }

    // ---------------------------------------------------------
    // RIGHT SIDE
    // ---------------------------------------------------------

    else {

      player.lane = Math.min(
        LANE_COUNT - 1,
        player.lane + 1
      );

      player.steerR = true;
      player.steerL = false;
    }
  });

  // ---------------------------------------------------------------------------
  // HELPERS
  // ---------------------------------------------------------------------------

  function randInt(min, max) {

    return Math.floor(
      Math.random() * (max - min + 1)
    ) + min;
  }

  // ---------------------------------------------------------------------------
  // PIXEL FONT
  // ---------------------------------------------------------------------------

  const FONT = {

    "0": [0b0110, 0b1001, 0b1001, 0b1001, 0b0110],
    "1": [0b0010, 0b0110, 0b0010, 0b0010, 0b0111],
    "2": [0b0110, 0b1001, 0b0010, 0b0100, 0b1111],
    "3": [0b1110, 0b0001, 0b0110, 0b0001, 0b1110],
    "4": [0b0001, 0b0011, 0b0101, 0b1111, 0b0001],
    "5": [0b1111, 0b1000, 0b1110, 0b0001, 0b1110],
    "6": [0b0110, 0b1000, 0b1110, 0b1001, 0b0110],
    "7": [0b1111, 0b0001, 0b0010, 0b0100, 0b0100],
    "8": [0b0110, 0b1001, 0b0110, 0b1001, 0b0110],
    "9": [0b0110, 0b1001, 0b0111, 0b0001, 0b0110],

    "A": [0b0110, 0b1001, 0b1111, 0b1001, 0b1001],
    "B": [0b1110, 0b1001, 0b1110, 0b1001, 0b1110],
    "C": [0b0111, 0b1000, 0b1000, 0b1000, 0b0111],
    "D": [0b1110, 0b1001, 0b1001, 0b1001, 0b1110],
    "E": [0b1111, 0b1000, 0b1110, 0b1000, 0b1111],
    "F": [0b1111, 0b1000, 0b1110, 0b1000, 0b1000],
    "G": [0b0111, 0b1000, 0b1011, 0b1001, 0b0111],
    "H": [0b1001, 0b1001, 0b1111, 0b1001, 0b1001],
    "I": [0b1111, 0b0100, 0b0100, 0b0100, 0b1111],
    "J": [0b0001, 0b0001, 0b0001, 0b1001, 0b0110],
    "K": [0b1001, 0b1010, 0b1100, 0b1010, 0b1001],
    "L": [0b1000, 0b1000, 0b1000, 0b1000, 0b1111],
    "M": [0b1001, 0b1111, 0b1111, 0b1001, 0b1001],
    "N": [0b1001, 0b1101, 0b1101, 0b1011, 0b1001],
    "O": [0b0110, 0b1001, 0b1001, 0b1001, 0b0110],
    "P": [0b1110, 0b1001, 0b1110, 0b1000, 0b1000],
    "Q": [0b0110, 0b1001, 0b1001, 0b1011, 0b0111],
    "R": [0b1110, 0b1001, 0b1110, 0b1010, 0b1001],
    "S": [0b0111, 0b1000, 0b0110, 0b0001, 0b1110],
    "T": [0b1111, 0b0100, 0b0100, 0b0100, 0b0100],
    "U": [0b1001, 0b1001, 0b1001, 0b1001, 0b0110],
    "V": [0b1001, 0b1001, 0b1001, 0b0110, 0b0110],
    "W": [0b1001, 0b1001, 0b1111, 0b1111, 0b1001],
    "X": [0b1001, 0b0110, 0b0110, 0b0110, 0b1001],
    "Y": [0b1001, 0b0110, 0b0100, 0b0100, 0b0100],
    "Z": [0b1111, 0b0010, 0b0100, 0b1000, 0b1111],

    ":": [0b0000, 0b0100, 0b0000, 0b0100, 0b0000],
    "/": [0b0001, 0b0010, 0b0100, 0b1000, 0b0000],
    ".": [0b0000, 0b0000, 0b0000, 0b0000, 0b0100],
    "-": [0b0000, 0b0000, 0b1110, 0b0000, 0b0000],
    "!": [0b0100, 0b0100, 0b0100, 0b0000, 0b0100]
  };

  // ---------------------------------------------------------------------------
  // DRAW CHARACTER
  // ---------------------------------------------------------------------------

  function drawChar(ch, x, y, color, scale) {

    scale = scale || 1;

    const glyph = FONT[ch.toUpperCase()];

    if (!glyph) {
      return 2 * scale * 3;
    }

    for (let row = 0; row < 5; row++) {

      for (let col = 0; col < 4; col++) {

        if (
          glyph[row] &
          (1 << (3 - col))
        ) {

          ctx.fillStyle = color;

          ctx.fillRect(
            x + col * scale,
            y + row * scale,
            scale,
            scale
          );
        }
      }
    }

    return 4 * scale + 1;
  }

  // ---------------------------------------------------------------------------
  // DRAW TEXT
  // ---------------------------------------------------------------------------

  function drawText(
    str,
    x,
    y,
    color,
    scale,
    rightAlign
  ) {

    scale = scale || 1;

    let px = x;

    if (rightAlign) {

      let w = 0;

      for (let i = 0; i < str.length; i++) {

        const g =
          FONT[str[i].toUpperCase()];

        w += g
          ? 4 * scale + 1
          : 2 * scale;
      }

      px = x - w;
    }

    for (let i = 0; i < str.length; i++) {

      px += drawChar(
        str[i],
        px,
        y,
        color,
        scale
      );
    }

    return px - x;
  }

  // ---------------------------------------------------------------------------
  // TEXT WIDTH
  // ---------------------------------------------------------------------------

  function textWidth(str, scale) {

    scale = scale || 1;

    let w = 0;

    for (let i = 0; i < str.length; i++) {

      const g =
        FONT[str[i].toUpperCase()];

      w += g
        ? 4 * scale + 1
        : 2 * scale;
    }

    return w;
  }

  // ---------------------------------------------------------------------------
  // DRAW CAR
  // ---------------------------------------------------------------------------

  function drawCar(
    cx,
    cy,
    w,
    h,
    body,
    shade,
    glass,
    facingDown,
    steer
  ) {

    const leftW =
      steer === -1 ? 2 : 0;

    const rightW =
      steer === 1 ? 2 : 0;

    // Body
    ctx.fillStyle = body;

    ctx.fillRect(
      cx - w / 2,
      cy - h / 2,
      w,
      h
    );

    // Dark lower shading
    ctx.fillStyle = shade;

    ctx.fillRect(
      cx - w / 2,
      cy + h / 4,
      w,
      h / 4
    );

    // Glass
    ctx.fillStyle = glass;

    if (facingDown) {

      ctx.fillRect(
        cx - w / 2 + 4,
        cy - h / 2 + 8,
        w - 8,
        10
      );

      ctx.fillRect(
        cx - w / 2 + 5,
        cy + h / 2 - 14,
        w - 10,
        6
      );

    } else {

      ctx.fillRect(
        cx - w / 2 + 4,
        cy + h / 2 - 18,
        w - 8,
        10
      );

      ctx.fillRect(
        cx - w / 2 + 5,
        cy - h / 2 + 8,
        w - 10,
        6
      );
    }

    // Wheels
    ctx.fillStyle = C.wheel;

    const ww = 4;
    const wh = 10;

    if (facingDown) {

      ctx.fillRect(
        cx - w / 2 - ww + leftW,
        cy - h / 2 + 6,
        ww,
        wh
      );

      ctx.fillRect(
        cx + w / 2 - rightW,
        cy - h / 2 + 6,
        ww,
        wh
      );

      ctx.fillRect(
        cx - w / 2 - ww - leftW,
        cy + h / 2 - 16,
        ww,
        wh
      );

      ctx.fillRect(
        cx + w / 2 + rightW,
        cy + h / 2 - 16,
        ww,
        wh
      );

    } else {

      ctx.fillRect(
        cx - w / 2 - ww + leftW,
        cy - h / 2 + 6,
        ww,
        wh
      );

      ctx.fillRect(
        cx + w / 2 - rightW,
        cy - h / 2 + 6,
        ww,
        wh
      );

      ctx.fillRect(
        cx - w / 2 - ww - leftW,
        cy + h / 2 - 16,
        ww,
        wh
      );

      ctx.fillRect(
        cx + w / 2 + rightW,
        cy + h / 2 - 16,
        ww,
        wh
      );
    }

    // Nose highlight
    ctx.fillStyle = "#ffffff";

    if (facingDown) {

      ctx.fillRect(
        cx - 1,
        cy - h / 2,
        2,
        3
      );

    } else {

      ctx.fillRect(
        cx - 1,
        cy + h / 2 - 3,
        2,
        3
      );
    }
  }

  // ---------------------------------------------------------------------------
  // BACKGROUND
  // ---------------------------------------------------------------------------

  function drawBackground() {

    const stripeW = 16;

    // Grass
    for (
      let x = 0;
      x < GRASS_W;
      x += stripeW
    ) {

      ctx.fillStyle =
        (
          Math.floor(
            (x + grassOffset) / stripeW
          ) % 2 === 0
        )
          ? C.grass1
          : C.grass2;

      ctx.fillRect(
        x,
        HUD_H,
        stripeW,
        H - HUD_H
      );

      ctx.fillRect(
        W - GRASS_W + x,
        HUD_H,
        stripeW,
        H - HUD_H
      );
    }

    // Grass texture
    ctx.fillStyle = "#009900";

    for (
      let y = HUD_H;
      y < H;
      y += 40
    ) {

      const gy =
        (
          y +
          Math.floor(grassOffset / 8)
        ) %
        (H - HUD_H) +
        HUD_H;

      ctx.fillRect(8, gy, 2, 2);
      ctx.fillRect(20, gy + 18, 2, 2);

      ctx.fillRect(
        W - 10,
        gy + 8,
        2,
        2
      );

      ctx.fillRect(
        W - 24,
        gy + 24,
        2,
        2
      );
    }

    // Road
    ctx.fillStyle = C.road;

    ctx.fillRect(
      ROAD_X,
      HUD_H,
      ROAD_W,
      H - HUD_H
    );

    // Road edges
    for (
      let y = HUD_H;
      y < H;
      y += 16
    ) {

      const yy =
        (
          y +
          Math.floor(dashOffset)
        ) % 16;

      ctx.fillStyle =
        (
          (
            y +
            Math.floor(dashOffset)
          ) % 32 < 16
        )
          ? C.white
          : C.roadEdgeL;

      ctx.fillRect(
        ROAD_X,
        y + yy,
        3,
        16
      );

      ctx.fillRect(
        ROAD_X + ROAD_W - 3,
        y + yy,
        3,
        16
      );
    }

    // Lane dividers
    ctx.fillStyle = C.dash;

    const dashH = 14;
    const dashGap = 18;

    for (
      let d = 1;
      d < LANE_COUNT;
      d++
    ) {

      const dx =
        Math.round(
          ROAD_X + d * LANE_W
        ) - 1;

      for (
        let y = HUD_H;
        y < H;
        y += dashH + dashGap
      ) {

        const yy =
          (
            y + dashOffset
          ) %
          (dashH + dashGap);

        ctx.fillRect(
          dx,
          y + yy,
          2,
          dashH
        );
      }
    }
  }

  // ---------------------------------------------------------------------------
  // HUD
  // ---------------------------------------------------------------------------

  function drawHUD() {

    ctx.fillStyle = C.hudBg;

    ctx.fillRect(
      0,
      0,
      W,
      HUD_H
    );

    // Score
    drawText(
      "SCORE:" + score,
      4,
      4,
      C.hudText,
      2
    );

    // Speed
    const kmh =
      Math.round(speed * 30);

    drawText(
      kmh + "KM/H",
      W - 4,
      4,
      C.hudText,
      2,
      true
    );

    // Speed bar
    const bars =
      Math.min(
        5,
        Math.round(speed)
      );

    for (let i = 0; i < 5; i++) {

      ctx.fillStyle =
        i < bars
          ? C.green
          : "#222222";

      ctx.fillRect(
        W - 30 + i * 5,
        20,
        3,
        4
      );
    }
  }

  // ---------------------------------------------------------------------------
  // START GAME
  // ---------------------------------------------------------------------------

  function startGame() {

    state = STATE.PLAY;

    score = 0;

    speed = SPEED_MIN;

    player.lane = 1;

    player.x = laneCenter(1);

    player.y = H - 72;

    player.steerL = false;
    player.steerR = false;

    keys.up = false;
    keys.down = false;

    enemies = [];

    spawnTimer = 0;

    frame = 0;
  }

  // ---------------------------------------------------------------------------
  // GAME OVER
  // ---------------------------------------------------------------------------

  function gameOver() {
    state = STATE.OVER;
  }

  // ---------------------------------------------------------------------------
  // COLLISION
  // ---------------------------------------------------------------------------

  function rectsCollide(a, b) {

    return (
      a.x < b.x + b.w &&
      a.x + a.w > b.x &&
      a.y < b.y + b.h &&
      a.y + a.h > b.y
    );
  }

  // ---------------------------------------------------------------------------
  // UPDATE GAME
  // ---------------------------------------------------------------------------

  function update(dt) {

    frame++;

    if (state !== STATE.PLAY) {
      return;
    }

    // ---------------------------------------------------------
    // SPEED CONTROL
    // ---------------------------------------------------------

    if (keys.up) {

      speed =
        Math.min(
          SPEED_MAX,
          speed + 0.012
        );

    } else if (keys.down) {

      speed =
        Math.max(
          SPEED_MIN,
          speed - 0.03
        );

    } else {

      if (
        speed >
        SPEED_MIN + 0.4
      ) {

        speed -= 0.004;

      } else if (
        speed < SPEED_MIN
      ) {

        speed += 0.005;
      }
    }

    // ---------------------------------------------------------
    // STEERING
    // ---------------------------------------------------------

    /*
     * FIXED STEERING SYSTEM
     *
     * player.lane contains the selected lane.
     *
     * 0 = LEFT
     * 1 = CENTER
     * 2 = RIGHT
     *
     * The player.x position smoothly follows that lane.
     *
     * This allows:
     *
     * LEFT -> CENTER
     * CENTER -> LEFT
     * CENTER -> RIGHT
     * RIGHT -> CENTER
     *
     * with one key press.
     */

    const targetX =
      laneCenter(player.lane);

    const laneMoveSpeed = 0.22;

    const distance =
      targetX - player.x;

    if (
      Math.abs(distance) > 0.25
    ) {

      player.x +=
        distance * laneMoveSpeed;

    } else {

      player.x = targetX;

      player.steerL = false;
      player.steerR = false;
    }

    // ---------------------------------------------------------
    // SCROLLING
    // ---------------------------------------------------------

    dashOffset =
      (dashOffset + speed) % 32;

    grassOffset =
      (grassOffset + speed * 1.4) % 32;

    // ---------------------------------------------------------
    // SCORE
    // ---------------------------------------------------------

    score += Math.round(speed);

    // ---------------------------------------------------------
    // ENEMY SPAWNING
    // ---------------------------------------------------------

    spawnTimer++;

    const interval =
      Math.max(
        24,
        spawnInterval -
        Math.floor(
          (speed - SPEED_MIN) * 20
        )
      );

    if (spawnTimer >= interval) {

      spawnTimer = 0;

      const lane =
        randInt(0, 2);

      const type =
        Math.random() < 0.5
          ? "blue"
          : "yellow";

      const eSpeed =
        speed *
        randInt(2, 5) / 4;

      enemies.push({

        lane: lane,

        x: laneCenter(lane),

        y: -50,

        w: 26,

        h: 42,

        type: type,

        speed: eSpeed,

        dodged: false
      });
    }

    // ---------------------------------------------------------
    // ENEMY UPDATE + COLLISION
    // ---------------------------------------------------------

    for (
      let i = enemies.length - 1;
      i >= 0;
      i--
    ) {

      const e = enemies[i];

      e.y +=
        e.speed +
        speed * 0.35;

      // Player collision box
      const pBox = {

        x:
          player.x -
          player.w / 2 +
          4,

        y:
          player.y -
          player.h / 2 +
          4,

        w:
          player.w - 8,

        h:
          player.h - 8
      };

      // Enemy collision box
      const eBox = {

        x:
          e.x -
          e.w / 2 +
          4,

        y:
          e.y -
          e.h / 2 +
          4,

        w:
          e.w - 8,

        h:
          e.h - 8
      };

      if (
        rectsCollide(
          pBox,
          eBox
        )
      ) {

        gameOver();
        return;
      }

      // Dodged enemy
      if (
        !e.dodged &&
        e.y >
        player.y +
        player.h / 2
      ) {

        e.dodged = true;

        score += DODGE_SCORE;
      }

      // Remove enemy
      if (
        e.y >
        H + 60
      ) {

        enemies.splice(i, 1);
      }
    }
  }

  // ---------------------------------------------------------------------------
  // TITLE SCREEN
  // ---------------------------------------------------------------------------

  function drawTitle() {

    drawBackground();

    // Dark overlay
    ctx.fillStyle =
      "rgba(0,0,0,0.65)";

    ctx.fillRect(
      0,
      HUD_H,
      W,
      H - HUD_H
    );

    // Title
    drawText(
      "RETRO",
      W / 2 -
      textWidth("RETRO", 3) / 2,
      60,
      "#ff3333",
      3
    );

    drawText(
      "RACER",
      W / 2 -
      textWidth("RACER", 3) / 2,
      80,
      "#ffaa00",
      3
    );

    drawText(
      "J2ME EDITION",
      W / 2 -
      textWidth(
        "J2ME EDITION",
        2
      ) / 2,
      116,
      "#00ff00",
      2
    );

    // Decorative cars
    drawCar(
      laneCenter(1),
      180,
      26,
      42,
      C.carRed,
      C.carRedDark,
      C.carRedGlass,
      true,
      0
    );

    drawCar(
      laneCenter(0),
      230,
      26,
      42,
      C.carBlue,
      C.carBlueDark,
      C.carBlueGlass,
      false,
      0
    );

    drawCar(
      laneCenter(2),
      230,
      26,
      42,
      C.carYellow,
      C.carYellowDark,
      C.carYellowGlass,
      false,
      0
    );

    // Start text
    if (
      Math.floor(frame / 28) % 2 === 0
    ) {

      drawText(
        "PRESS SPACE TO START",
        W / 2 -
        textWidth(
          "PRESS SPACE TO START",
          1
        ) / 2,
        286,
        "#ffffff",
        1
      );
    }

    drawText(
      "ARROWS: STEER/SPEED",
      W / 2 -
      textWidth(
        "ARROWS: STEER/SPEED",
        1
      ) / 2,
      302,
      "#888888",
      1
    );
  }

  // ---------------------------------------------------------------------------
  // GAME OVER SCREEN
  // ---------------------------------------------------------------------------

  function drawGameOver() {

    // Freeze playfield
    drawBackground();

    for (
      let i = 0;
      i < enemies.length;
      i++
    ) {

      drawEnemy(
        enemies[i]
      );
    }

    drawPlayer();

    drawHUD();

    // Explosion
    if (
      Math.floor(frame / 6) % 2 === 0
    ) {

      ctx.fillStyle = "#ff6600";

      ctx.fillRect(
        player.x - 20,
        player.y - 26,
        40,
        52
      );

      ctx.fillStyle = "#ffcc00";

      ctx.fillRect(
        player.x - 12,
        player.y - 18,
        24,
        36
      );
    }

    // Dark panel
    ctx.fillStyle =
      "rgba(0,0,0,0.8)";

    ctx.fillRect(
      20,
      90,
      W - 40,
      140
    );

    ctx.fillStyle =
      C.hudText;

    ctx.fillRect(
      20,
      90,
      W - 40,
      2
    );

    ctx.fillRect(
      20,
      228,
      W - 40,
      2
    );

    drawText(
      "GAME OVER",
      W / 2 -
      textWidth(
        "GAME OVER",
        2
      ) / 2,
      110,
      "#ff3333",
      2
    );

    drawText(
      "SCORE: " + score,
      W / 2 -
      textWidth(
        "SCORE: " + score,
        2
      ) / 2,
      146,
      "#ffaa00",
      2
    );

    drawText(
      "SPEED: " +
      Math.round(speed * 30) +
      " KM/H",
      W / 2 -
      textWidth(
        "SPEED: " +
        Math.round(speed * 30) +
        " KM/H",
        1
      ) / 2,
      176,
      "#ffffff",
      1
    );

    if (
      Math.floor(frame / 28) % 2 === 0
    ) {

      drawText(
        "PRESS SPACE TO CONTINUE",
        W / 2 -
        textWidth(
          "PRESS SPACE TO CONTINUE",
          1
        ) / 2,
        206,
        "#888888",
        1
      );
    }
  }

  // ---------------------------------------------------------------------------
  // DRAW ENEMY
  // ---------------------------------------------------------------------------

  function drawEnemy(e) {

    if (e.type === "blue") {

      drawCar(
        e.x,
        e.y,
        e.w,
        e.h,
        C.carBlue,
        C.carBlueDark,
        C.carBlueGlass,
        false,
        0
      );

    } else {

      drawCar(
        e.x,
        e.y,
        e.w,
        e.h,
        C.carYellow,
        C.carYellowDark,
        C.carYellowGlass,
        false,
        0
      );
    }
  }

  // ---------------------------------------------------------------------------
  // DRAW PLAYER
  // ---------------------------------------------------------------------------

  function drawPlayer() {

    const steer =
      player.steerL
        ? -1
        : (
            player.steerR
              ? 1
              : 0
          );

    drawCar(
      player.x,
      player.y,
      player.w,
      player.h,
      C.carRed,
      C.carRedDark,
      C.carRedGlass,
      true,
      steer
    );
  }

  // ---------------------------------------------------------------------------
  // DRAW PLAY SCREEN
  // ---------------------------------------------------------------------------

  function drawPlay() {

    drawBackground();

    for (
      let i = 0;
      i < enemies.length;
      i++
    ) {

      drawEnemy(
        enemies[i]
      );
    }

    drawPlayer();

    drawHUD();
  }

  // ---------------------------------------------------------------------------
  // MAIN GAME LOOP
  // ---------------------------------------------------------------------------

  let lastTime = 0;

  function loop(now) {

    const dt =
      now - lastTime;

    lastTime = now;

    // Avoid large jumps after tab switching.
    if (dt < 120) {
      update(dt);
    }

    ctx.clearRect(
      0,
      0,
      W,
      H
    );

    if (
      state === STATE.TITLE
    ) {

      drawTitle();

    } else if (
      state === STATE.PLAY
    ) {

      drawPlay();

    } else {

      drawGameOver();
    }

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

})();
</script>

</body>
</html>
